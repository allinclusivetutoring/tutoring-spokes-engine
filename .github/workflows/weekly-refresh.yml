name: Weekly official-source review

on:
  schedule:
    # Sunday 00:00 UTC (Saturday 17:00 in Phoenix).
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-official-source-review
  cancel-in-progress: false

jobs:
  crawl-review-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python -m spoke_engine validate

      - name: Crawl approved official sources
        env:
          CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
        run: python -m spoke_engine crawl

      - name: Verify crawl produced output
        run: |
          if [ ! -f data/crawl_snapshot.json ]; then
            echo "::error::Crawl produced no snapshot — crawler did not run"
            exit 1
          fi

      - name: Build a no-index preview
        run: python -m spoke_engine generate --preview

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Upload review preview
        uses: actions/upload-artifact@v4
        with:
          name: tutoring-spokes-review-preview
          path: |
            preview-dist/
            reports/change_report.md
          retention-days: 14

      - name: Summarize crawl results
        run: |
          snapshot="data/crawl_snapshot.json"
          candidates="data/candidates.json"
          sources_checked=0
          sources_ok=0
          sources_failed=0
          fail_reasons=""
          if [ -f "$snapshot" ]; then
            sources_checked=$(python -c "import json; d=json.load(open('$snapshot')); print(len(d.get('pages',{})))")
            sources_ok=$sources_checked
          fi
          if [ -f "$candidates" ]; then
            sources_failed=$(python -c "import json; d=json.load(open('$candidates')); print(len(d.get('errors',[])))")
            if [ "$sources_failed" -gt 0 ]; then
              sources_ok=$((sources_checked - sources_failed))
              fail_reasons=$(python -c "
          import json
          errs = json.load(open('$candidates')).get('errors', [])
          for e in errs:
              print(f\"- \`{e['program_id']}\` {e['url']}: {e['error']}\")
          ")
            fi
          fi
          {
            echo "## Weekly Crawl Summary"
            echo ""
            echo "- **Sources checked:** $sources_checked"
            echo "- **Sources OK:** $sources_ok"
            echo "- **Sources failed:** $sources_failed"
            if [ -n "$fail_reasons" ]; then
              echo ""
              echo "### Failure reasons"
              echo "$fail_reasons"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open or update the weekly review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/weekly-official-source-review"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          mkdir -p data reports
          git add -A -- data reports
          if git diff --cached --quiet; then
            echo "No changes to commit" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Review weekly official-source changes"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Review weekly official scholarship-source changes" \
              --body-file reports/change_report.md
          else
            gh pr edit "$existing" --body-file reports/change_report.md
          fi

