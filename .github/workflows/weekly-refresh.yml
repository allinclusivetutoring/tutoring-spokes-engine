name: Weekly official-source review

on:
  schedule:
    # Sunday 00:00 UTC (Saturday 17:00 in Phoenix).
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-official-source-review
  cancel-in-progress: false

jobs:
  crawl-review-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate configuration
        run: python engine.py validate

      - name: Crawl approved official sources
        env:
          CRAWLER_CONTACT: ${{ vars.CRAWLER_CONTACT }}
          CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT }}
        run: python engine.py crawl

      - name: Build a no-index preview
        run: python engine.py generate --preview

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Upload review preview
        uses: actions/upload-artifact@v4
        with:
          name: tutoring-spokes-review-preview
          path: |
            preview-dist/
            reports/change_report.md
          retention-days: 14

      - name: Open or update the weekly review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/weekly-official-source-review"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/candidates.json data/crawl_snapshot.json reports/change_report.md
          if git diff --cached --quiet; then
            echo "No official-source changes to review."
            exit 0
          fi
          git commit -m "Review weekly official-source changes"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "Review weekly official scholarship-source changes" \
              --body-file reports/change_report.md
          else
            gh pr edit "$existing" --body-file reports/change_report.md
          fi

